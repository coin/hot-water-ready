# Throwaway Home Assistant for trying Hot Water Ready with fake heater entities.
# Started by dev/testha.sh; the runtime state lives in dev/testha/config (git-ignored).
default_config:

logger:
  default: warning
  logs:
    custom_components.hot_water_ready: debug

input_boolean:
  fake_relay:
    name: Fake relay

input_number:
  fake_water_temperature:
    name: Fake water temperature
    min: 5
    max: 70
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    initial: 39.6

template:
  - switch:
      - name: Fake heater relay
        unique_id: fake_heater_relay
        state: "{{ is_state('input_boolean.fake_relay', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.fake_relay
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.fake_relay
  - sensor:
      - name: Fake water temperature
        unique_id: fake_water_temperature
        device_class: temperature
        unit_of_measurement: "°C"
        state: "{{ states('input_number.fake_water_temperature') }}"

# A simulated cylinder: while the fake relay is on the water warms 0.5 C every 30 s
# (1 C/min, faster than a real element so trials are quick); off, it cools 0.02 C.
automation:
  - id: fake_cylinder_physics
    alias: Fake cylinder physics
    mode: single
    triggers:
      - trigger: time_pattern
        seconds: "/30"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.fake_water_temperature
        data:
          value: >-
            {% set t = states('input_number.fake_water_temperature') | float(20) %}
            {% if is_state('input_boolean.fake_relay', 'on') %}{{ [t + 0.5, 70] | min | round(1) }}
            {% else %}{{ [t - 0.02, 5] | max | round(2) }}{% endif %}

# A real thermostat over the same fake relay and water, for the climate setup (b).
climate:
  - platform: generic_thermostat
    name: Fake boiler
    unique_id: fake_boiler
    heater: switch.fake_heater_relay
    target_sensor: sensor.fake_water_temperature
    initial_hvac_mode: "off"
    target_temp: 30
    min_temp: 20
    max_temp: 70
    cold_tolerance: 0
    hot_tolerance: 0
