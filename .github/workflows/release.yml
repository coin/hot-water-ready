name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check the tag matches the manifest version
        run: |
          version=$(jq -r .version custom_components/hot_water_ready/manifest.json)
          [ "v$version" = "${{ github.event.release.tag_name }}" ] || [ "$version" = "${{ github.event.release.tag_name }}" ] \
            || { echo "Tag ${{ github.event.release.tag_name }} does not match manifest version $version"; exit 1; }
      - name: Build the card
        working-directory: card
        run: npm ci && npm run build
      - name: Package the integration
        run: cd custom_components/hot_water_ready && zip -r ../../hot_water_ready.zip . -x '__pycache__/*'
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" hot_water_ready.zip --clobber
