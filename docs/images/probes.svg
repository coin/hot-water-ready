<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="Roboto, Arial, sans-serif" role="img" aria-label="A lying tank seen from its end: the element at the middle, the main probe at 80% and the second probe at 45% of the height. The heated water above the element splits halfway between the probes, at 62.5%: the main probe stands for 69% of it, the second for 31%.">
  <rect width="720" height="360" rx="16" fill="#1c1c1c"/>
  <defs>
    <clipPath id="tank"><circle cx="190" cy="180" r="140"/></clipPath>
  </defs>
  <!-- water below the element: barely warms -->
  <g clip-path="url(#tank)">
    <rect x="50" y="40" width="280" height="280" fill="#2b3f55"/>
    <!-- heated water: above 50% (y 180); split at 62.5% (y 145) -->
    <rect x="50" y="40" width="280" height="105" fill="#c8602f"/>
    <rect x="50" y="145" width="280" height="35" fill="#e08a4f"/>
  </g>
  <circle cx="190" cy="180" r="140" fill="none" stroke="#9e9e9e" stroke-width="3"/>
  <!-- the split halfway between the probes -->
  <line x1="62" y1="145" x2="318" y2="145" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.7"/>
  <!-- the element -->
  <line x1="70" y1="180" x2="310" y2="180" stroke="#f2c14e" stroke-width="5" stroke-linecap="round"/>
  <!-- probes -->
  <circle cx="300" cy="96" r="8" fill="#ffffff"/>
  <circle cx="290" cy="194" r="8" fill="#ffffff" stroke="#1c1c1c" stroke-width="2"/>
  <!-- leader lines -->
  <line x1="308" y1="96" x2="380" y2="96" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="298" y1="194" x2="380" y2="214" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="318" y1="145" x2="380" y2="150" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  <line x1="310" y1="180" x2="380" y2="180" stroke="#f2c14e" stroke-width="1.5"/>
  <line x1="300" y1="270" x2="380" y2="262" stroke="#9fb6cc" stroke-width="1.5"/>
  <!-- labels -->
  <text x="390" y="92" fill="#ffffff" font-size="17" font-weight="700">Main probe, 80%</text>
  <text x="390" y="114" fill="#ffd2b5" font-size="14">stands for 69% of the heated water</text>
  <text x="390" y="155" fill="#e1e1e1" font-size="14">split halfway between the probes, 62.5%</text>
  <text x="390" y="185" fill="#f2c14e" font-size="14">element, in the middle (50%)</text>
  <text x="390" y="212" fill="#ffffff" font-size="17" font-weight="700">Second probe, 45%</text>
  <text x="390" y="234" fill="#ffd2b5" font-size="14">stands for the other 31%</text>
  <text x="390" y="267" fill="#9fb6cc" font-size="14">below the element: barely warms</text>
  <text x="40" y="346" fill="#9e9e9e" font-size="13">A lying tank seen from its end. Heights from the bottom (0%) to the top (100%).</text>
</svg>
